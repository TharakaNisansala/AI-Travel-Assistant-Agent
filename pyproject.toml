[project]
name = "ai-travel-assistant"
version = "0.1.0"
description = "Sri Lanka-focused AI travel assistant (single-agent LangGraph + Gemini, CLI)"
authors = [
    { name = "tharakanisansala", email = "tbalasuriya2001@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-google-genai>=4.4.3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests", "."]
extend-exclude = ["docs"]  # don't reformat code samples inside the planning docs

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax for the target version
    "SIM", # simplifications
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import root-level scripts like smoke_gemini.py
# Live tests (real API calls) are skipped by default; run them with: pytest -m live
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: calls real external APIs (deselect with -m 'not live')",
]
